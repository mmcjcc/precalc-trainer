# Precalc Trainer — nginx site config.
#
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile. The image's stock
# /etc/nginx/nginx.conf includes it inside `http {}`, so only http-level (map) and
# server-level directives belong here. Validated with `nginx -t` at image build time.
#
# What it does
#   * serves the Vite build from /usr/share/nginx/html with an SPA fallback to index.html
#   * /assets/* (content-hashed by Vite) is cached for a year and marked immutable
#   * index.html and /config.js (runtime PIN config written at container start) are always
#     revalidated (no-cache), so a new deploy or a PIN rotation is picked up immediately
#     and a phone never runs a stale index.html against chunks that no longer exist
#   * gzip for text assets, a few security headers, a 503 stub on /api/ for the future tutor
#
# Note on add_header: nginx drops ALL inherited add_header lines the moment a location block
# defines its own. So every header lives here at server level (with `always`), and the
# per-path Cache-Control value comes from the map below instead of per-location add_headers.

map $uri $precalc_cache_control {
    default        "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens     off;
    absolute_redirect off;    # keep redirects relative: TLS terminates at the Container Apps ingress

    # ---- compression --------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;      # a proxy (the ingress) always sits in front of us; compress anyway
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript application/json
                    application/manifest+json image/svg+xml;
    # text/html is always gzipped; woff/woff2 are already compressed and are left alone.

    # ---- headers, once, server-wide (see note above) ------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control $precalc_cache_control always;
    # Content-Security-Policy, written for this exact stack:
    #   script-src 'unsafe-eval'                  function-plot compiles expressions with new Function
    #   style-src  'unsafe-inline' + googleapis   KaTeX emits inline style= attributes; Inter is loaded
    #                                             from fonts.googleapis.com (index.html)
    #   font-src   gstatic + data:                Google font files; KaTeX fonts are under /assets ('self')
    #   img-src    data: blob:                    Vite inlines small images as data: URIs
    # The production index.html has no inline scripts, so script-src stays 'self'.
    # If the app renders blank after a deploy, open the browser console: a CSP block reads
    # "Refused to load ..." and names the directive to loosen. To switch it off, comment this line.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- health: used by deploy/smoke.sh, the Docker HEALTHCHECK and a wake-up cron ------
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Vite's hashed bundles and fonts: a missing chunk is a real 404, never index.html --
    location /assets/ {
        try_files $uri =404;
    }

    # ---- reserved: tutor API. Fails fast now so a stray fetch('/api/...') never receives ----
    # ---- index.html as JSON. Later: a second (sidecar) container in the same Container App --
    # ---- replica, reachable on localhost; uncomment and keep --target-port 80 unchanged. ---
    location /api/ {
        return 503;
        # proxy_pass         http://127.0.0.1:3000;
        # proxy_http_version 1.1;
        # proxy_set_header   Host              $host;
        # proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        # proxy_read_timeout 60s;
    }

    # ---- SPA: real files first (index.html, config.js, favicon.svg), else index.html ------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
