# Precalc Trainer — nginx site config.
#
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile. The image's stock
# /etc/nginx/nginx.conf includes it inside `http {}`, so only http-level (map) and
# server-level directives belong here. Validated with `nginx -t` at image build time.
#
# What it does
#   * lets only allowlisted, signed-in accounts load anything except /healthz (see the
#     "sign-in allowlist" map below); everyone else gets a 403 page with a sign-out link
#   * serves the Vite build from /usr/share/nginx/html with an SPA fallback to index.html
#   * /assets/* (content-hashed by Vite) is cached for a year and marked immutable
#   * index.html and /config.js (runtime config written at container start) are always
#     revalidated (no-cache), so a new deploy or a PIN rotation is picked up immediately
#     and a phone never runs a stale index.html against chunks that no longer exist
#   * gzip for text assets, a few security headers
#   * /api/ goes to the tutor sidecar, 127.0.0.1:3000 unless TUTOR_UPSTREAM says otherwise
#     (503 JSON "tutor offline" without one)
#
# Files written at container start. The image is never written to after the build, so it can run
# as any user on a read-only root file system; what depends on the environment is written to
# /tmp/precalc by the start-up hooks (docker/*.sh) and included from here. A missing file stops
# nginx from starting, so an image started without its hooks stays closed.
#   listen.conf      `listen <LISTEN_PORT>;` (80 unless set)                       10-listen.sh
#   config.js        served as /config.js                                         20-config.sh
#   sign-out.conf    empty, or a redirect for /.auth/logout (SIGN_OUT_URL)        20-config.sh
#   identity.conf    `set $precalc_identity $http_<the sign-in header>;`          25-allowlist.sh
#   allowlist.map    the body of the allowlist map below                          25-allowlist.sh
#   tutor.conf       the `proxy_pass` for /api/ (TUTOR_UPSTREAM)                  30-tutor.sh
# nginx's own scratch directories go there too (they default to /var/cache/nginx), and the
# Dockerfile moves the pid file to /tmp/nginx.pid.
#
# Note on add_header: nginx drops ALL inherited add_header lines the moment a location block
# defines its own. So every header lives here at server level (with `always`), and the
# per-path Cache-Control value comes from the map below instead of per-location add_headers.

client_body_temp_path /tmp/precalc/client_temp;
proxy_temp_path       /tmp/precalc/proxy_temp;
fastcgi_temp_path     /tmp/precalc/fastcgi_temp;
uwsgi_temp_path       /tmp/precalc/uwsgi_temp;
scgi_temp_path        /tmp/precalc/scgi_temp;

map $uri $precalc_cache_control {
    default        "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
}

# ---- sign-in allowlist ------------------------------------------------------------------------
# On Azure, Container Apps authentication (Sign in with Google) runs in front of nginx. It sends
# every signed-in request with X-MS-CLIENT-PRINCIPAL-NAME set to the account's email, and requests
# from the internet cannot set that header while sign-in is on. Behind another sign-in proxy
# AUTH_HEADER names its header instead (oauth2-proxy: X-Auth-Request-Email). Either way
# $precalc_identity is the value of that one header (identity.conf, included in the server block).
# docker/25-allowlist.sh writes the entries at container start from ALLOWED_USERS: "default 0;"
# plus one "~*^email$ 1;" per account, or "default 1;" when AUTH_ALLOWLIST=off (local runs and CI).
map $precalc_identity $precalc_allowed {
    include /tmp/precalc/allowlist.map;
}

server {
    include /tmp/precalc/listen.conf;      # listen <LISTEN_PORT>;  (80 unless set)
    include /tmp/precalc/identity.conf;    # set $precalc_identity $http_<the sign-in header>;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens     off;
    absolute_redirect off;    # keep redirects relative: TLS terminates at the Container Apps ingress

    # ---- compression --------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;      # a proxy (the ingress) always sits in front of us; compress anyway
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript application/json
                    application/manifest+json image/svg+xml;
    # text/html is always gzipped; woff/woff2 are already compressed and are left alone.

    # ---- headers, once, server-wide (see note above) ------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control $precalc_cache_control always;
    # Content-Security-Policy, written for this exact stack:
    #   script-src 'unsafe-eval'                  function-plot compiles expressions with new Function
    #   style-src  'unsafe-inline' + googleapis   KaTeX emits inline style= attributes; Inter is loaded
    #                                             from fonts.googleapis.com (index.html)
    #   font-src   gstatic + data:                Google font files; KaTeX fonts are under /assets ('self')
    #   img-src    data: blob:                    Vite inlines small images as data: URIs
    # The production index.html has no inline scripts, so script-src stays 'self'.
    # If the app renders blank after a deploy, open the browser console: a CSP block reads
    # "Refused to load ..." and names the directive to loosen. To switch it off, comment this line.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- accounts not on the list: a 403 page with a sign-out link (docker/not-allowed.html) --
    # Every gated location below does `if ($precalc_allowed != 1) { return 403; }`; a return is
    # the one thing that is always safe inside `if` in a location. Testing against 1 rather than
    # 0 keeps a map that somehow yields neither (an empty or truncated include file) closed.
    # The page itself is ungated.
    error_page 403 /not-allowed.html;
    location = /not-allowed.html {
        internal;
        root /usr/share/nginx/errors;
    }

    # ---- sign-out: empty on Azure, where Container Apps sign-in answers /.auth/logout before ---
    # ---- nginx sees it. With SIGN_OUT_URL set (another sign-in proxy in front) this is ---------
    # ---- `location = /.auth/logout { return 302 "<SIGN_OUT_URL>"; }`, open like the 403 page, --
    # ---- so the app and that page keep the one sign-out link they already use. ----------------
    include /tmp/precalc/sign-out.conf;

    # ---- health: open on purpose (answers only "ok"); used by deploy/smoke.sh, the Docker ----
    # ---- HEALTHCHECK and the deploy workflow. Container Apps sign-in also excludes /healthz. --
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- runtime config for the SPA, written at container start by docker/20-config.sh --------
    location = /config.js {
        if ($precalc_allowed != 1) { return 403; }
        root /tmp/precalc;
    }

    # ---- Vite's hashed bundles and fonts: a missing chunk is a real 404, never index.html --
    location /assets/ {
        if ($precalc_allowed != 1) { return 403; }
        try_files $uri =404;
    }

    # ---- tutor API: the sidecar container (server/, image precalc-tutor) in the same replica --
    # ---- listens on 127.0.0.1:3000. Same allowlist gate as every other path; the sidecar ----
    # ---- re-checks the account itself. Answers stream as Server-Sent Events, so nothing is ---
    # ---- buffered and the read timeout outlasts the tutor's own 60 s limit (it also sends ----
    # ---- a keep-alive comment every 15 s). With no sidecar (web image alone: local docker ---
    # ---- run, CI smoke) nginx cannot connect (502) or times out (504), and the named -------
    # ---- location turns that into 503 {"error":"tutor offline"} so the SPA gets JSON. ------
    # ---- tutor.conf is the proxy_pass line: http://127.0.0.1:3000 unless TUTOR_UPSTREAM names -
    # ---- the tutor (docker/30-tutor.sh); a name that does not resolve is a 502 as well. ------
    location /api/ {
        if ($precalc_allowed != 1) { return 403; }
        client_max_body_size  64k;
        include               /tmp/precalc/tutor.conf;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $http_x_forwarded_proto;
        # The tutor reads the account from this one header whatever the sign-in layer calls its
        # own, so what a client sends under this name never reaches it unless it is that header.
        proxy_set_header      X-MS-CLIENT-PRINCIPAL-NAME $precalc_identity;
        # The sidecar needs the email only: not the sign-in cookie, the claims or Google's tokens.
        proxy_set_header      Cookie                          "";
        proxy_set_header      X-MS-CLIENT-PRINCIPAL           "";
        proxy_set_header      X-MS-TOKEN-GOOGLE-ACCESS-TOKEN  "";
        proxy_set_header      X-MS-TOKEN-GOOGLE-ID-TOKEN      "";
        proxy_set_header      X-MS-TOKEN-GOOGLE-REFRESH-TOKEN "";
        # Nor what another sign-in proxy adds (oauth2-proxy's X-Auth-Request-* and X-Forwarded-*
        # headers, a bearer token). Its own account header is dropped too: the account goes on
        # under the one name above only. Container Apps sends none of these.
        proxy_set_header      Authorization                       "";
        proxy_set_header      X-Auth-Request-Email                "";
        proxy_set_header      X-Auth-Request-User                 "";
        proxy_set_header      X-Auth-Request-Groups               "";
        proxy_set_header      X-Auth-Request-Preferred-Username   "";
        proxy_set_header      X-Auth-Request-Access-Token         "";
        proxy_set_header      X-Forwarded-Email                   "";
        proxy_set_header      X-Forwarded-User                    "";
        proxy_set_header      X-Forwarded-Groups                  "";
        proxy_set_header      X-Forwarded-Access-Token            "";
        proxy_buffering       off;
        proxy_cache           off;
        proxy_connect_timeout 2s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
        # An error_page here stops the server-level one from being inherited, so repeat it.
        error_page 403 /not-allowed.html;
        error_page 502 504 = @tutor_offline;
    }

    location @tutor_offline {
        default_type application/json;
        return 503 '{"error":"tutor offline"}\n';
    }

    # ---- SPA: real files first (index.html, favicon.svg), else index.html ------------------
    location / {
        if ($precalc_allowed != 1) { return 403; }
        try_files $uri $uri/ /index.html;
    }
}
