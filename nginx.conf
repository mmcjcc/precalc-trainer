# Precalc Trainer — nginx site config.
#
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile. The image's stock
# /etc/nginx/nginx.conf includes it inside `http {}`, so only http-level (map) and
# server-level directives belong here. Validated with `nginx -t` at image build time.
#
# What it does
#   * lets only allowlisted, signed-in accounts load anything except /healthz (see the
#     "sign-in allowlist" map below); everyone else gets a 403 page with a sign-out link
#   * serves the Vite build from /usr/share/nginx/html with an SPA fallback to index.html
#   * /assets/* (content-hashed by Vite) is cached for a year and marked immutable
#   * index.html and /config.js (runtime config written at container start) are always
#     revalidated (no-cache), so a new deploy or a PIN rotation is picked up immediately
#     and a phone never runs a stale index.html against chunks that no longer exist
#   * gzip for text assets, a few security headers
#   * /api/ goes to the tutor sidecar on 127.0.0.1:3000 (503 JSON "tutor offline" without one)
#
# Note on add_header: nginx drops ALL inherited add_header lines the moment a location block
# defines its own. So every header lives here at server level (with `always`), and the
# per-path Cache-Control value comes from the map below instead of per-location add_headers.

map $uri $precalc_cache_control {
    default        "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
}

# ---- sign-in allowlist ------------------------------------------------------------------------
# On Azure, Container Apps authentication (Sign in with Google) runs in front of nginx. It sends
# every signed-in request with X-MS-CLIENT-PRINCIPAL-NAME set to the account's email, and requests
# from the internet cannot set that header while sign-in is on. docker/25-allowlist.sh writes the
# entries at container start from ALLOWED_USERS: "default 0;" plus one "~*^email$ 1;" per account,
# or "default 1;" when AUTH_ALLOWLIST=off (local runs and CI). The Dockerfile ships a "default 0;"
# placeholder so `nginx -t` works at build time and a missing list means nobody gets in.
map $http_x_ms_client_principal_name $precalc_allowed {
    include /etc/nginx/precalc/allowlist.map;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens     off;
    absolute_redirect off;    # keep redirects relative: TLS terminates at the Container Apps ingress

    # ---- compression --------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;      # a proxy (the ingress) always sits in front of us; compress anyway
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript application/json
                    application/manifest+json image/svg+xml;
    # text/html is always gzipped; woff/woff2 are already compressed and are left alone.

    # ---- headers, once, server-wide (see note above) ------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control $precalc_cache_control always;
    # Content-Security-Policy, written for this exact stack:
    #   script-src 'unsafe-eval'                  function-plot compiles expressions with new Function
    #   style-src  'unsafe-inline' + googleapis   KaTeX emits inline style= attributes; Inter is loaded
    #                                             from fonts.googleapis.com (index.html)
    #   font-src   gstatic + data:                Google font files; KaTeX fonts are under /assets ('self')
    #   img-src    data: blob:                    Vite inlines small images as data: URIs
    # The production index.html has no inline scripts, so script-src stays 'self'.
    # If the app renders blank after a deploy, open the browser console: a CSP block reads
    # "Refused to load ..." and names the directive to loosen. To switch it off, comment this line.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- accounts not on the list: a 403 page with a sign-out link (docker/not-allowed.html) --
    # Every gated location below does `if ($precalc_allowed != 1) { return 403; }`; a return is
    # the one thing that is always safe inside `if` in a location. Testing against 1 rather than
    # 0 keeps a map that somehow yields neither (an empty or truncated include file) closed.
    # The page itself is ungated.
    error_page 403 /not-allowed.html;
    location = /not-allowed.html {
        internal;
        root /usr/share/nginx/errors;
    }

    # ---- health: open on purpose (answers only "ok"); used by deploy/smoke.sh, the Docker ----
    # ---- HEALTHCHECK and the deploy workflow. Container Apps sign-in also excludes /healthz. --
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Vite's hashed bundles and fonts: a missing chunk is a real 404, never index.html --
    location /assets/ {
        if ($precalc_allowed != 1) { return 403; }
        try_files $uri =404;
    }

    # ---- tutor API: the sidecar container (server/, image precalc-tutor) in the same replica --
    # ---- listens on 127.0.0.1:3000. Same allowlist gate as every other path; the sidecar ----
    # ---- re-checks the account itself. Answers stream as Server-Sent Events, so nothing is ---
    # ---- buffered and the read timeout outlasts the tutor's own 60 s limit (it also sends ----
    # ---- a keep-alive comment every 15 s). With no sidecar (web image alone: local docker ---
    # ---- run, CI smoke) nginx cannot connect (502) or times out (504), and the named -------
    # ---- location turns that into 503 {"error":"tutor offline"} so the SPA gets JSON. ------
    location /api/ {
        if ($precalc_allowed != 1) { return 403; }
        client_max_body_size  64k;
        proxy_pass            http://127.0.0.1:3000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header      X-MS-CLIENT-PRINCIPAL-NAME $http_x_ms_client_principal_name;
        # The sidecar needs the email only: not the sign-in cookie, the claims or Google's tokens.
        proxy_set_header      Cookie                          "";
        proxy_set_header      X-MS-CLIENT-PRINCIPAL           "";
        proxy_set_header      X-MS-TOKEN-GOOGLE-ACCESS-TOKEN  "";
        proxy_set_header      X-MS-TOKEN-GOOGLE-ID-TOKEN      "";
        proxy_set_header      X-MS-TOKEN-GOOGLE-REFRESH-TOKEN "";
        proxy_buffering       off;
        proxy_cache           off;
        proxy_connect_timeout 2s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
        # An error_page here stops the server-level one from being inherited, so repeat it.
        error_page 403 /not-allowed.html;
        error_page 502 504 = @tutor_offline;
    }

    location @tutor_offline {
        default_type application/json;
        return 503 '{"error":"tutor offline"}\n';
    }

    # ---- SPA: real files first (index.html, config.js, favicon.svg), else index.html ------
    location / {
        if ($precalc_allowed != 1) { return 403; }
        try_files $uri $uri/ /index.html;
    }
}
